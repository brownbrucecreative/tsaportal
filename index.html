<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSA Student Portal</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body { background: #0b1329; color: #f8fafc; font-family: 'Segoe UI',sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .portal-card { background: #1c2541; border: 1px solid #3a506b; border-radius: 16px; padding: 40px 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .gold-text { color: #ffb703; font-size: 26px; letter-spacing: 1px; }
    .btn-tsa { background: #00b4d8; color: #0b1329; font-weight: bold; border-radius: 8px; border: none; font-size: 16px; letter-spacing: 0.5px; transition: all 0.2s; }
    .btn-tsa:hover { background: #90e0ef; transform: translateY(-1px); }
    .form-control { background: #0b1329; border: 1px solid #3a506b; color: #f8fafc; border-radius: 8px; padding: 12px 15px; margin-top: 5px; }
    .form-control:focus { background: #0b1329; border-color: #00b4d8; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25); }
    .ledger-row { background: #0b1329; border: 1px solid #3a506b; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .spinner-border { width: 1.2rem; height: 1.2rem; display: inline-block; vertical-align: text-bottom; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="portal-card">
    <div id="loginView">
      <div class="text-center mb-5"><h2 class="fw-bold gold-text mb-1">TEINE'S SIVA ACADEMY</h2><p class="text-muted small text-uppercase tracking-wider">Secure Portal</p></div>
      <div class="mb-4"><label class="text-muted small fw-bold">STUDENT FULL NAME</label><input type="text" id="studentNameInput" class="form-control form-control-lg" placeholder="e.g. Brown Bruce"></div>
      <div class="mb-5"><label class="text-muted small fw-bold">INVOICE NUMBER</label><input type="text" id="invoiceNumberInput" class="form-control form-control-lg" placeholder="e.g. 2026-061"></div>
      <button class="btn btn-tsa btn-lg w-100 py-3 mb-2" onclick="handlePortalLogin()">VERIFY & VIEW BALANCE</button>
      <div id="loginStatus" class="text-center small fw-bold mt-3"></div>
    </div>
    <div id="dashboardView" style="display: none;">
      <div class="text-center mb-4"><h4 class="fw-bold gold-text mb-1">Statement Summary</h4><p class="text-muted small" id="lblDisplaySummary"></p></div>
      <div class="ledger-row"><span>Student:</span><strong id="displayStudent"></strong></div>
      <div class="ledger-row"><span>Class:</span><strong id="displayClass"></strong></div>
      <div class="ledger-row"><span>Total Fee:</span><strong id="displayTotal"></strong></div>
      <div class="ledger-row"><span>Total Paid:</span><strong class="text-success" id="displayPaid"></strong></div>
      <div class="ledger-row" style="background: rgba(255,183,3,0.1); border-color: #ffb703;"><span>Outstanding Balance:</span><strong class="gold-text" id="displayBalance"></strong></div>
      <button class="btn btn-tsa w-100 py-3 mt-4 mb-2" onclick="switchPortalView('uploadView')">Log & Upload Payment →</button>
      <button class="btn btn-outline-secondary btn-sm w-100 mt-3 text-muted border-0" onclick="executeSecureLogout()">Secure Logout 🔒</button>
    </div>
    <div id="uploadView" style="display: none;">
      <div class="mb-4"><h4 class="fw-bold gold-text mb-1">Log Bank Transfer</h4><p class="text-muted small">Upload your screenshot verification receipt</p></div>
      <div class="mb-3"><label class="text-muted small fw-bold">CONFIRM AMOUNT TRANSFERRED ($)</label><input type="number" id="uploadAmountInput" class="form-control form-control-lg" placeholder="0.00"></div>
      <div class="mb-3"><label class="text-muted small fw-bold">DATE OF PAYMENT</label><input type="date" id="uploadDateInput" class="form-control form-control-lg"></div>
      <div class="mb-4"><label class="text-muted small fw-bold">CHOOSE SCREENSHOT</label><input type="file" id="uploadFileInput" class="form-control form-control-lg" accept="image/*"></div>
      <button class="btn btn-tsa w-100 py-3 mb-2" onclick="handleReceiptUploadProcess()">Submit Payment Receipt</button>
      <button class="btn btn-outline-secondary btn-sm w-100 mt-2 text-muted border-0" onclick="switchPortalView('dashboardView')">← Return to My Balance</button>
      <div id="uploadStatus" class="text-center small fw-bold mt-3"></div>
    </div>
  </div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbylTZJeMPsqvDQd4nCZCo48w5mz5k7jXx20tPQSEdHYnl2PrimFIGJ0vNDOupkG8XB0/exec";
    let activeStudentName = "", activeInvoiceNumber = "";
    function switchPortalView(id) { document.getElementById("loginView").style.display = "none"; document.getElementById("dashboardView").style.display = "none"; document.getElementById("uploadView").style.display = "none"; document.getElementById(id).style.display = "block"; }
    function handlePortalLogin() {
      const name = document.getElementById("studentNameInput").value.trim();
      const inv = document.getElementById("invoiceNumberInput").value.trim();
      const status = document.getElementById("loginStatus");
      if (!name || !inv) { status.className = "text-center text-danger small fw-bold mt-2"; status.innerHTML = "❌ Please enter both Student Full Name and Invoice Number."; return; }
      status.className = "text-center text-info small fw-bold mt-2"; status.innerHTML = `<div class="spinner-border text-info" role="status"></div> Verifying login...`;
      fetch(`${API_URL}?action=login&studentName=${encodeURIComponent(name)}&invoiceNumber=${encodeURIComponent(inv)}`, { method: "GET", mode: "cors" })
        .then(r => r.text()).then(txt => {
          if (txt.startsWith("ERROR") || txt.startsWith("INVALID")) throw new Error(txt);
          const res = JSON.parse(txt);
          if (res.status === "success") {
            activeStudentName = res.studentName; activeInvoiceNumber = res.invoiceNumber;
            document.getElementById("displayStudent").textContent = res.studentName; document.getElementById("displayClass").textContent = res.class; document.getElementById("displayTotal").textContent = "$" + res.totalFees; document.getElementById("displayPaid").textContent = "$" + res.amountPaid; document.getElementById("displayBalance").textContent = "$" + res.remainingBalance; document.getElementById("lblDisplaySummary").textContent = `Invoice #${res.invoiceNumber}`;
            status.innerHTML = ""; switchPortalView("dashboardView");
          }
        }).catch(err => { status.className = "text-center text-danger small fw-bold mt-2"; status.innerHTML = err.message.includes("mismatch") ? "❌ Verification failed. Incorrect credentials." : "❌ network authentication timeout error"; });
    }
    function handleReceiptUploadProcess() {
      const amt = document.getElementById("uploadAmountInput").value.trim();
      const dt = document.getElementById("uploadDateInput").value;
      const fileEl = document.getElementById("uploadFileInput");
      const status = document.getElementById("uploadStatus");
      if (!amt || !dt || fileEl.files.length === 0) { status.className = "text-center text-danger small fw-bold mt-3"; status.innerHTML = "❌ Please complete all fields."; return; }
      status.className = "text-center text-info small fw-bold mt-3"; status.innerHTML = `<div class="spinner-border text-info" role="status"></div> Submitting screenshot...`;
      const reader = new FileReader();
      reader.onloadend = function() {
        fetch(API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "uploadReceipt", studentName: activeStudentName, invoiceNumber: activeInvoiceNumber, fileData: reader.result, amountLogged: amt, dateLogged: dt }) })
        .then(() => { status.className = "text-center text-success small fw-bold mt-3"; status.innerHTML = "🎉 Thank you for logging that payment! Our Admin team will reconcile it soon."; document.getElementById("uploadAmountInput").value = ""; document.getElementById("uploadDateInput").value = ""; fileEl.value = ""; })
        .catch(() => { status.className = "text-center text-danger small fw-bold mt-3"; status.innerHTML = "❌ File submission failed."; });
      };
      reader.readAsDataURL(fileEl.files);
    }
    function executeSecureLogout() { activeStudentName = ""; activeInvoiceNumber = ""; document.getElementById("studentNameInput").value = ""; document.getElementById("invoiceNumberInput").value = ""; document.getElementById("loginStatus").innerHTML = ""; switchPortalView("loginView"); }
  </script>
</body>
</html>
